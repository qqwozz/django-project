<!-- Home content for HTMX requests -->
<style>
    .category-card {
        position: relative;
        height: 420px;
        overflow: hidden;
        cursor: pointer;
    }
    .category-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .category-card:hover img {
        transform: scale(1.08);
    }
    .category-card .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 100%);
        transition: background 0.4s ease;
    }
    .category-card:hover .overlay {
        background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.1) 100%);
    }
    .category-card .card-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 32px;
        z-index: 2;
    }
    .category-card .card-content h3 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: #fff;
        text-transform: uppercase;
        transition: letter-spacing 0.3s ease;
    }
    .category-card:hover .card-content h3 {
        letter-spacing: 0.25em;
    }
    .category-card .card-content .arrow {
        display: inline-block;
        margin-top: 12px;
        opacity: 0;
        transform: translateX(-10px);
        transition: all 0.3s ease;
    }
    .category-card:hover .card-content .arrow {
        opacity: 1;
        transform: translateX(0);
    }
    @media (max-width: 768px) {
        .category-card { height: 300px; }
    }
</style>

<main class="mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-16">
        <h2 class="text-4xl md:text-5xl font-bold tracking-tight text-gray-900 mb-4" style="letter-spacing: 0.08em;">
            ENFANTS RICHES DÉPRIMÉS
        </h2>
        <p class="text-base text-gray-500 tracking-wide uppercase" style="letter-spacing: 0.2em;">
            Select a category to browse our collection
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 max-w-6xl mx-auto">
        {% for category in categories %}
        <a href="{% url 'main:catalog' category.slug %}" 
           hx-get="{% url 'main:catalog' category.slug %}" 
           hx-target="#main-content" 
           hx-push-url="true"
           class="category-card group">
            {% if category.image %}
            <img src="{{ category.image.url }}" alt="{{ category.name }}" loading="lazy">
            {% else %}
            <div class="w-full h-full bg-gray-100"></div>
            {% endif %}
            <div class="overlay"></div>
            <div class="card-content">
                <h3>{{ category.name }}</h3>
                <span class="arrow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </span>
            </div>
        </a>
        {% endfor %}
    </div>
</main>
